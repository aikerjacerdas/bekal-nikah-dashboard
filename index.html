 tangga?","Bagaimana kami akan saling mendukung dalam proses memperbaiki diri?"],"fields":["Karakter positif yang kami hargai satu sama lain","Perbedaan karakter yang perlu kami pahami","Kebiasaan yang perlu diperbaiki","Komitmen pengembangan diri","Rencana tindak lanjut"]}},{"number":3,"title":"KOMUNIKASI DAN PENGELOLAAN EMOSI","questions":[{"number":1,"text":"Bagaimana cara Anda menyampaikan perasaan ketika sedang senang, sedih, kecewa, atau marah?","prompts":["Apakah Anda terbiasa menyampaikan perasaan secara langsung atau cenderung menyimpannya?","Apakah Anda mudah menceritakan sesuatu yang mengganggu pikiran?","Apa yang Anda harapkan dari pasangan ketika sedang mengalami masalah emosional?"]},{"number":2,"text":"Bagaimana Anda biasanya merespons ketika pasangan menyampaikan kritik atau ketidakpuasan?","prompts":["Apakah Anda cenderung mendengarkan, membela diri, atau merasa diserang?","Bagaimana Anda membedakan kritik yang membangun dengan perkataan yang menyakitkan?","Apa yang dapat membantu Anda menerima masukan dengan lebih baik?"]},{"number":3,"text":"Apa yang biasanya Anda lakukan ketika terjadi pertengkaran atau perbedaan pendapat?","prompts":["Apakah Anda ingin segera menyelesaikan masalah atau membutuhkan waktu untuk menenangkan diri?","Apakah Anda cenderung diam, meninggalkan pembicaraan, atau terus membahas masalah?","Berapa lama biasanya Anda membutuhkan waktu sebelum bersedia membicarakan masalah kembali?"]},{"number":4,"text":"Bagaimana Anda membangun komunikasi ketika memiliki pendapat atau keinginan yang berbeda dengan pasangan?","prompts":["Apakah Anda bersedia mendengarkan alasan di balik pendapat pasangan?","Bagaimana jika pendapat pasangan bertentangan dengan keinginan Anda?","Bagaimana Anda menentukan keputusan bersama ketika masing-masing memiliki pandangan berbeda?"]},{"number":5,"text":"Bagaimana cara Anda meminta maaf ketika melakukan kesalahan?","prompts":["Apakah Anda mudah mengakui kesalahan?","Bagaimana jika Anda merasa memiliki alas gungan keuangan kepada orang tua, saudara, atau anggota keluarga lainnya?","prompts":["Apakah Anda rutin memberikan bantuan keuangan kepada orang tua?","Apakah ada saudara atau anggota keluarga yang menjadi tanggungan Anda?","Berapa kisaran dana yang biasanya diberikan setiap bulan?","Apakah bantuan tersebut bersifat rutin atau hanya ketika ada kebutuhan tertentu?","Bagaimana jika kebutuhan keluarga besar bertambah setelah Anda menikah?","Apakah terdapat kemungkinan tanggungan keluarga tersebut bertambah atau berubah dalam beberapa tahun ke depan?"]},{"number":8,"text":"Bagaimana pandangan Anda mengenai tabungan, dana darurat, investasi, dan perencanaan keuangan keluarga?","prompts":["Apakah Anda memiliki target tabungan setelah menikah?","Berapa dana darurat yang ingin disiapkan?","Apakah Anda tertarik melakukan investasi untuk kebutuhan jangka panjang?","Bagaimana Anda menentukan instrumen investasi yang sesuai dengan prinsip syariah?","Apa yang akan dilakukan jika keluarga menghadapi kebutuhan mendadak?","Bagaimana Anda memastikan bahwa investasi yang dipilih sesuai dengan prinsip syariah dan memiliki risiko yang dapat dipahami?","Bagaimana jika investasi mengalami kerugian atau nilainya menurun?"]},{"number":9,"text":"Bagaimana Anda akan mengambil keputusan keuangan besar yang dapat memengaruhi kehidupan rumah tangga setelah menikah?","prompts":["Apakah pembelian rumah, kendaraan, atau aset bernilai besar perlu dibicarakan bersama?","Bagaimana jika salah satu pasangan ingin mengambil pinjaman untuk kebutuhan tertentu?","Apakah Anda bersedia membicarakan dan memperoleh persetujuan pasangan sebelum menjadi penjamin utang atau menggunakan aset bersama sebagai jaminan?","Bagaimana jika Anda dan pasangan memiliki pandangan berbeda mengenai penggunaan uang?"]},{"number":10,"text":"Apa komitmen Anda untuk menjaga kesehatan keuangan dan mengelola kewajiban utang setelah menikah?","prompts":["Apakah Anda bersedia terbuka mengenai kewajiban keuangan yang dapat memengaruhi an, dan tanggung jawab suami istri dalam kehidupan rumah tangga?"]},{"number":2,"text":"Bagaimana Anda memahami konsep kepemimpinan dan tanggung jawab suami dalam rumah tangga menurut ajaran Islam?","prompts":["Bagaimana seorang suami seharusnya menjalankan tanggung jawab kepemimpinannya dalam keluarga?","Bagaimana istri dilibatkan dalam proses pengambilan keputusan?","Bagaimana jika suami dan istri memiliki pandangan yang berbeda?","Bagaimana memastikan kepemimpinan keluarga tidak berubah menjadi sikap otoriter, pemaksaan, atau tindakan yang merendahkan pasangan?"]},{"number":3,"text":"Bagaimana Anda memandang pembagian pekerjaan dan tanggung jawab domestik dalam rumah tangga?","prompts":["Bagaimana pandangan Anda mengenai pembagian tugas memasak, membersihkan rumah, mencuci, dan mengurus kebutuhan sehari-hari?","Apakah pekerjaan domestik perlu dibagi berdasarkan kesepakatan dan kondisi masing-masing?","Bagaimana jika salah satu pasangan memiliki pekerjaan yang lebih padat?","Apakah Anda bersedia mengambil tanggung jawab tambahan ketika pasangan sedang sakit atau mengalami kesibukan?"]},{"number":4,"text":"Bagaimana pandangan Anda mengenai istri yang bekerja atau menjalankan usaha setelah menikah?","prompts":["Apakah Anda mengharapkan pasangan tetap bekerja setelah menikah?","Bagaimana jika pekerjaan pasangan mengharuskannya bekerja di luar rumah?","Bagaimana jika salah satu pasangan memperoleh kesempatan karier yang lebih baik di kota lain?","Bagaimana Anda menyikapi kondisi ketika pekerjaan mulai mengurangi waktu bersama keluarga?","Bagaimana jika salah satu pasangan ingin melanjutkan pendidikan atau mengembangkan usaha setelah menikah?"]},{"number":5,"text":"Bagaimana Anda menentukan waktu berkualitas untuk pasangan dan keluarga di tengah kesibukan sehari-hari?","prompts":["Berapa banyak waktu yang menurut Anda perlu disediakan untuk pasangan setiap hari?","Bagaimana jika salah satu pasangan harus bekerja hingga malam atau sering melakukan perjalanan dinas?","Apakah Anda ingin memiliki waktu khusus untuk kegiatan bersama?","Bagaimana menjaga keseimbangan antara pekerjaan, ibadah, keluarga, dan kebutuhan pribadi?"]},{"number":6,"text":"Bagaimana Anda ingin membangun mekanisme pengambilan keputusan dalam kehidupan rumah tangga?","prompts":["Keputusan apa saja yang menurut Anda harus dibicarakan dan disepakati bersama?","Bagaimana jika keputusan tersebut berkaitan dengan kepentingan salah satu pihak secara khusus?","Bagaimana jika terjadi perbedaan pendapat yang sulit diselesaikan?","Apakah Anda bersedia menunda keputusan besar sampai kedua pihak memiliki informasi dan pemahaman yang cukup?"]},{"number":7,"text":"Bagaimana pandangan Anda mengenai penggunaan waktu pribadi setelah menikah?","prompts":["Apakah menurut Anda suami dan istri tetap perlu memiliki waktu untuk hobi dan aktivitas masing-masing?","Bagaimana jika pasangan ingin berkumpul dengan teman atau melakukan kegiatan di luar rumah?","Apakah Anda menganggap pasangan harus selalu melakukan semua aktivitas bersama?","Batasan apa yang perlu disepakati agar waktu pribadi tidak mengganggu tanggung jawab keluarga?"]},{"number":8,"text":"Bagaimana Anda ingin menjalankan tanggung jawab rumah tangga ketika salah satu pasangan sakit atau tidak mampu bekerja?","prompts":["Bagaimana jika suami mengalami penurunan penghasilan karena sakit?","Bagaimana jika istri mengalami kondisi kesehatan yang membuatnya tidak dapat menjalankan aktivitas seperti biasa?","Bagaimana tanggung jawab rumah tangga akan disesuaikan dalam keadaan tersebut?","Apakah Anda bersedia mengambil tanggung jawab tambahan ketika pasangan sedang mengalami kesulitan?","Bagaimana jika kondisi tersebut berlangsung dalam waktu lama dan membutuhkan penyesuaian ekonomi maupun pembagian tanggung jawab?"]},{"number":9,"text":"Bagaimana Anda menyikapi keterlibatan keluarga besar dalam urusan rumah tangga?","prompts":["Apakah keputusan rumah tangga boleh dipengaruhi oleh pendapat orang tua atau saudara?","Bagaimana jika orang tua meminta sesuatu yang bertentangan dengan kesepakatan pasangan?","Bagaimana menjaga hubungan baik dengan orang tua tanpa mengabaikan tanggung jawab terhadap pasangan?","Bagaimana jika salah satu pasangan merasa terlalu banyak campur tangan dari keluarga besar?"]},{"number":10,"text":"Bagaimana Anda ingin membangun kerja sama dan mengevaluasi pembagian tanggung jawab setelah menikah?","prompts":["Apakah Anda bersedia mengevaluasi pembagian tugas rumah tangga secara berkala?","Bagaimana jika salah satu pasangan merasa terbebani?","Bagaimana cara menyampaikan ketidakpuasan tanpa merendahkan pasangan?","Apa komitmen Anda untuk menjaga agar tanggung jawab rumah tangga tetap berjalan secara adil dan realistis?"]}],"discussionReflection":{"heading":"REFLEKSI SETELAH DISKUSI","intro":"Setelah menyelesaikan sepuluh pertanyaan, calon pasangan pria dan calon pasangan wanita mengisi refleksi berikut.","questions":["Apakah kami memiliki pemahaman yang sama mengenai peran dan tanggung jawab suami serta istri?","Bagaimana pembagian pekerjaan dan tanggung jawab rumah tangga yang kami anggap realistis?","Bagaimana kami akan menyikapi pekerjaan, pendidikan, dan pengembangan karier setelah menikah?","Bagaimana kami akan mengambil keputusan penting dalam keluarga?","Apa yang akan kami lakukan jika salah satu pihak merasa terbebani oleh tanggung jawab rumah tangga?"],"fields":["Pemahaman mengenai peran suami dan istri","Kesepakatan pembagian pekerjaan rumah tangga","Kesepakatan mengenai pekerjaan dan karier","Kesepakatan pengambilan keputusan keluarga","Kesepakatan mengenai ruang pribadi dan waktu bersama","Cara mengevaluasi pembagian tanggung jawab","Rencana tindak lanjut"]}},{"number":6,"title":"HUBUNGAN DENGAN KELUARGA BESAR","questions":[{"number":1,"text":"Bagaimana hubungan Anda dengan orang tua dan keluarga selama ini?","prompts":["Bagaimana hubungan Anda dengan ayah dan ibu?","Seberapa sering Anda berkomunikasi atau mengunjungi orang tua?","Apakah Anda terbiasa menceritakan persoalan pribadi kepada keluarga?","Bagaimana hubungan Anda dengan saudara kandung dan anggota keluarga lainnya?","Sejauh mana Anda terbiasa mengambil keputusan sendiri tanpa selalu bergantung pada pendapat keluarga?"]},{"number":2,"text":"Bagaimana Anda memahami dan menjalankan kewajiban berbakti kepada orang tua setelah menikah?","prompts":["Bagaimana Anda ingin tetap berbakti kepada orang tua setelah memiliki keluarga sendiri?","Apakah Anda memiliki kebiasaan rutin mengunjungi atau membantu orang tua?","Bagaimana jika orang tua membutuhkan perhatian dan bantuan lebih besar setelah Anda menikah?","Bagaimana cara menjaga hubungan dengan orang tua ketika pasangan memiliki kebutuhan keluarga yang berbeda?"]},{"number":3,"text":"Bagaimana pandangan Anda mengenai tinggal bersama orang tua atau mertua setelah menikah?","prompts":["Apakah Anda ingin tinggal mandiri setelah menikah?","Apakah Anda bersedia tinggal bersama orang tua atau mertua jika kondisi ekonomi belum memungkinkan?","Berapa lama rencana tinggal bersama tersebut?","Bagaimana menjaga privasi dan kemandirian rumah tangga jika tinggal bersama keluarga besar?","Jika rencana tempat tinggal berubah karena kondisi ekonomi atau keadaan keluarga, bagaimana Anda ingin membicarakannya dan menentukan keputusan bersama?"]},{"number":4,"text":"Bagaimana Anda menyikapi keterlibatan orang tua atau keluarga besar dalam persoalan rumah tangga?","prompts":["Bagaimana jika orang tua memberikan pendapat yang tidak sesuai dengan keputusan pasangan?","Bagaimana jika salah satu orang tua terlalu sering mengatur urusan rumah tangga?","Apakah Anda bersedia menyampaikan batasan kepada keluarga dengan cara yang sopan?","Bagaimana jika pasangan merasa tidak nyaman dengan campur tangan keluarga Anda?"]},{"number":5,"text":"Bagaimana Anda menyikapi perbedaan kebiasaan, budaya, atau tradisi antara kedua keluarga?","prompts":["Apakah keluarga Anda memiliki tradisi tertentu yang dianggap penting?","Bagaimana jika kebiasaan keluarga pasangan berbeda dengan kebiasaan keluarga Anda?","Apakah ada tradisi keluarga yang menurut Anda perlu dipertahankan setelah menikah?","Bagaimana jika terdapat tradisi yang tidak sesuai dengan kemampuan atau kesepakatan rumah tangga?"]},{"number":6,"text":"Apakah Anda memiliki tanggung jawab khusus terhadap anggota keluarga selain orang tua?","prompts":["Apakah ada saudara atau anggota keluarga yang menjadi tanggungan Anda?","Apakah Anda bertanggung jawab membantu biaya pendidikan atau kebutuhan hidup saudara?","Apakah ada anggota keluarga yang membutuhkan perawatan khusus?","Bagaimana jika tanggung jawab tersebut berlangsung setelah Anda menikah?","Apakah tanggung jawab tersebut bersifat sementara atau diperkirakan berlangsung dalam jangka panjang?"]},{"number":7,"text":"Bagaimana Anda ingin mengatur pemberian bantuan finansial kepada orang tua dan keluarga besar setelah menikah?","prompts":["Apakah Anda memiliki rencana memberikan bantuan rutin kepada orang tua atau saudara?","Bagaimana jika keluarga meminta bantuan keuangan dalam jumlah besar?","Apakah bantuan tersebut perlu dibicarakan terlebih dahulu dengan pasangan?","Bagaimana jika kebutuhan keluarga besar bertentangan dengan kebutuhan rumah tangga sendiri?"]},{"number":8,"text":"Bagaimana Anda menyikapi konflik yang terjadi antara pasangan dan orang tua atau anggota keluarga besar?","prompts":["Apa yang akan Anda lakukan jika pasangan merasa diperlakukan tidak adil oleh keluarga Anda?","Bagaimana jika orang tua tidak menyetujui suatu keputusan rumah tangga?","Apakah Anda bersedia mendengarkan kedua pihak sebelum mengambil sikap?","Bagaimana cara menyelesaikan konflik tanpa mempermalukan atau merendahkan anggota keluarga?"]},{"number":9,"text":"Bagaimana Anda membagi waktu antara keluarga sendiri dan keluarga pasangan setelah menikah?","prompts":["Seberapa sering Anda ingin mengunjungi keluarga masing-masing?","Bagaimana pembagian waktu ketika hari raya atau acara keluarga berlangsung bersamaan?","Bagaimana jika jarak tempat tinggal kedua keluarga cukup jauh?","Apakah Anda bersedia membuat jadwal kunjungan berdasarkan kesepakatan bersama?","Bagaimana jika salah satu keluarga memiliki kebutuhan khusus sehingga memerlukan kunjungan atau perhatian lebih sering?"]},{"number":10,"text":"Bagaimana Anda ingin membangun hubungan yang sehat dengan mertua dan keluarga pasangan?","prompts":["Bagaimana Anda ingin bersikap kepada orang tua pasangan?","Apa yang akan Anda lakukan jika terdapat perbedaan pendapat dengan mertua?","Bagaimana cara menyampaikan ketidaknyamanan tanpa merusak hubungan keluarga?","Apa batasan yang perlu dijaga agar hubungan dengan mertua tetap baik dan rumah tangga tetap mandiri?"]}],"discussionReflection":{"heading":"REFLEKSI SETELAH DISKUSI","intro":"Setelah menyelesaikan sepuluh pertanyaan, calon pasangan pria dan calon pasangan wanita mengisi refleksi berikut.","questions":["Apa tanggung jawab masing-masing terhadap orang tua dan keluarga asal yang perlu diketahui dan dipahami pasangan?","Apakah kami telah memiliki kesepahaman mengenai tempat tinggal dan hubungan dengan keluarga besar setelah menikah?","Bagaimana kami akan menjaga batas keterlibatan keluarga besar tanpa mengabaikan hubungan baik dengan mereka?","Bagaimana kami akan mengatur bantuan finansial, perhatian, dan tanggung jawab kepada kedua keluarga?","Bagaimana kami akan menyikapi dan menyelesaikan konflik yang melibatkan pasangan dan keluarga besar?"],"fields":["Tanggung jawab kepada orang tua dan keluarga asal","Rencana tempat tinggal setelah menikah","Batas keterlibatan keluarga besar","Kesepakatan bantuan finansial kepada keluarga","Cara menyelesaikan konflik keluarga","Kesepakatan kunjungan kepada kedua keluarga","Kesepakatan mengenai tanggung jawab khusus kepada anggota keluarga lain","Rencana tindak lanjut"]}},{"number":7,"title":"ANAK DAN POLA PENGASUHAN","questions":[{"number":1,"text":"Bagaimana pandangan dan harapan Anda mengenai kehadiran anak dalam kehidupan rumah tangga setelah menikah?","prompts":["Apakah Anda ingin segera memiliki anak setelah menikah atau menundanya terlebih dahulu?","Jika ingin menunda, apa alasan dan pertimbangannya?","Berapa jumlah anak yang Anda harapkan?","Bagaimana jika keinginan mengenai jumlah atau waktu memiliki anak berbeda dengan pasangan?","Bagaimana jika setelah menikah salah satu pihak mengalami perubahan pandangan mengenai waktu atau rencana memiliki anak?"]},{"number":2,"text":"Bagaimana pandangan Anda jika setelah menikah pasangan belum memperoleh keturunan dalam waktu yang diharapkan?","prompts":["Bagaimana Anda menyikapi kemungkinan kesulitan memperoleh keturunan?","Apakah Anda bersedia menjalani pemeriksaan kesehatan reproduksi bersama pasangan jika diperlukan?","Bagaimana jika hasil pemeriksaan menunjukkan adanya kondisi kesehatan tertentu?","Bagaimana Anda menghadapi tekanan atau pertanyaan dari keluarga besar mengenai keturunan?","Bagaimana jika salah satu pihak membutuhkan dukungan emosional lebih besar ketika menghadapi kondisi tersebut?","Bagaimana pandangan Anda mengenai pilihan penanganan medis yang disarankan oleh tenaga kesehatan?"]},{"number":3,"text":"Bagaimana pandangan Anda mengenai persiapan kesehatan fisik dan mental sebelum merencanakan kehamilan?","prompts":["Apakah Anda bersedia melakukan pemeriksaan kesehatan pranikah atau konsultasi kesehatan reproduksi?","Bagaimana pandangan Anda mengenai pemeriksaan penyakit menular seksual dan kondisi kesehatan yang dapat memengaruhi kehamilan?","Apakah terdapat riwayat kesehatan fisik atau mental yang relevan dan perlu diketahui pasangan?","Bagaimana jika tenaga kesehatan menyarankan pemeriksaan atau penanganan tertentu sebelum kehamilan?"]},{"number":4,"text":"Bagaimana Anda memahami tanggung jawab ayah dan ibu dalam membesarkan anak?","prompts":["Menurut Anda, apa tanggung jawab utama seorang ayah dalam pengasuhan anak?","Apa tanggung jawab utama seorang ibu?","Bagaimana ayah dan ibu dapat terlibat bersama dalam pendidikan dan perkembangan anak?","Bagaimana jika salah satu orang tua memiliki kesibukan pekerjaan yang tinggi?"]},{"number":5,"text":"Pola pengasuhan seperti apa yang ingin Anda terapkan kepada anak?","prompts":["Apakah Anda lebih menyukai pola pengasuhan yang tegas, demokratis, atau kombinasi sesuai kebutuhan anak?","Bagaimana Anda memberikan teguran ketika anak melakukan kesalahan?","Bagaimana pandangan Anda mengenai penggunaan hukuman fisik dan tindakan yang dapat merendahkan martabat anak dalam mendisiplinkan mereka?","Bagaimana Anda membangun kedekatan emosional dengan anak?"]},{"number":6,"text":"Bagaimana pendidikan agama dan pembentukan akhlak anak akan diterapkan dalam keluarga?","prompts":["Bagaimana Anda ingin mengenalkan tauhid, ibadah, dan akhlak kepada anak?","Apakah Anda ingin anak mengikuti pendidikan agama formal, pesantren, madrasah, atau pendidikan lainnya?","Bagaimana peran ayah dan ibu dalam memberikan keteladanan?","Bagaimana jika anak memiliki pertanyaan atau pandangan yang berbeda ketika mulai dewasa?","Bagaimana Anda akan menyikapi ketika anak memiliki pertanyaan kritis mengenai agama dan membutuhkan penjelasan yang lebih mendalam?"]},{"number":7,"text":"Bagaimana pandangan Anda mengenai pendidikan formal dan masa depan anak?","prompts":["Jenis pendidikan seperti apa yang Anda harapkan untuk anak?","Apakah Anda memiliki pandangan tertentu mengenai sekolah negeri, swasta, madrasah, atau pesantren?","Bagaimana jika minat dan bakat anak berbeda dengan keinginan orang tua?","Seberapa jauh Anda bersedia mengalokasikan dana untuk pendidikan anak?","Bagaimana jika kemampuan ekonomi keluarga tidak sesuai dengan rencana pendidikan yang sebelumnya diharapkan?"]},{"number":8,"text":"Bagaimana Anda membagi tanggung jawab pengasuhan ketika kedua orang tua bekerja?","prompts":["Siapa yang akan mengurus kebutuhan anak ketika kedua orang tua bekerja?","Apakah Anda bersedia menggunakan bantuan pengasuh atau keluarga jika diperlukan?","Bagaimana pembagian waktu untuk mengantar anak, mendampingi belajar, dan memenuhi kebutuhan sehari-hari?","Bagaimana jika salah satu orang tua harus mengurangi pekerjaan atau berhenti bekerja demi kebutuhan pengasuhan?","Bagaimana Anda memastikan anak tetap mendapatkan perhatian, pendampingan, dan pengawasan yang memadai ketika kedua orang tua memiliki kesibukan pekerjaan?"]},{"number":9,"text":"Bagaimana Anda menyikapi perbedaan pendapat dengan pasangan dalam mendidik anak?","prompts":["Bagaimana jika Anda ingin menerapkan aturan yang berbeda dari pasangan?","Apakah Anda bersedia membicarakan perbedaan pola asuh sebelum mengambil keputusan?","Bagaimana jika salah satu orang tua terlalu keras atau terlalu memanjakan anak?","Bagaimana jika kakek, nenek, atau keluarga besar memiliki cara pengasuhan yang berbeda?","Bagaimana jika perbedaan pola asuh berdampak terhadap kenyamanan, keselamatan, atau perkembangan anak?"]},{"number":10,"text":"Nilai dan bekal kehidupan apa yang paling ingin Anda tanamkan kepada anak?","prompts":["Karakter apa yang paling ingin Anda bentuk dalam diri anak?","Bagaimana Anda ingin mengajarkan kejujuran, tanggung jawab, kemandirian, dan kepedulian?","Bagaimana Anda mempersiapkan anak menghadapi perkembangan teknologi dan media sosial?","Bagaimana Anda ingin menjaga komunikasi dengan anak ketika mereka memasuki usia remaja dan dewasa?","Bagaimana Anda akan memberikan ruang kepada anak untuk mengembangkan minat, bakat, dan pilihan hidupnya ketika mulai dewasa?"]}],"discussionReflection":{"heading":"REFLEKSI SETELAH DISKUSI","intro":"Setelah menyelesaikan sepuluh pertanyaan, calon pasangan pria dan calon pasangan wanita mengisi refleksi berikut.","questions":["Apakah kami memiliki kesepahaman mengenai keinginan, waktu, dan rencana memiliki anak?","Bagaimana kami akan saling mendukung jika menghadapi kesulitan memperoleh keturunan?","Nilai agama, akhlak, dan karakter apa yang ingin kami tanamkan kepada anak?","Bagaimana kami akan membagi tanggung jawab dalam memenuhi kebutuhan, pendidikan, dan pengasuhan anak?","Bagaimana kami akan menyelesaikan perbedaan pendapat dalam mendidik dan membesarkan anak dengan tetap mengutamakan kepentingan anak?"],"fields":["Rencana memiliki anak","Pandangan mengenai jumlah dan waktu memiliki anak","Komitmen mengenai kesehatan sebelum kehamilan","Kesiapan menghadapi kondisi kesehatan dan kemungkinan belum memperoleh keturunan","Visi pendidikan dan pembentukan karakter anak","Pembagian tanggung jawab pengasuhan","Komitmen perlindungan, keamanan, dan pemenuhan hak anak","Cara menyelesaikan perbedaan pola asuh","Rencana tindak lanjut"]}},{"number":8,"title":"VISI, CITA-CITA, DAN MASA DEPAN","questions":[{"number":1,"text":"Apa tujuan utama yang ingin Anda capai melalui pernikahan?","prompts":["Apa makna pernikahan bagi Anda?","Kehidupan seperti apa yang ingin Anda bangun bersama pasangan?","Nilai apa yang paling ingin dijaga dalam rumah tangga?","Bagaimana Anda ingin hubungan suami istri berkembang seiring bertambahnya usia?","Bagaimana Anda ingin menjaga keseimbangan antara kebahagiaan pribadi, tanggung jawab kepada pasangan, dan tanggung jawab kepada Allah?"]},{"number":2,"text":"Bagaimana gambaran kehidupan rumah tangga yang ingin Anda bangun dalam lima sampai sepuluh tahun setelah menikah?","prompts":["Bagaimana kondisi keluarga yang Anda harapkan dalam lima tahun pertama?","Apa yang ingin dicapai dalam sepuluh tahun setelah menikah?","Apakah Anda memiliki target tertentu mengenai pekerjaan, tempat tinggal, pendidikan, atau kepemilikan aset?","Bagaimana jika perjalanan hidup tidak berjalan sesuai rencana?","Apa prioritas yang ingin dicapai terlebih dahulu dan mana yang dapat ditunda?"]},{"number":3,"text":"Di mana Anda ingin membangun kehidupan rumah tangga setelah menikah?","prompts":["Apakah Anda ingin tinggal di kota, desa, atau daerah tertentu?","Apakah Anda memiliki rencana tinggal dekat dengan tempat kerja atau keluarga?","Bagaimana jika pekerjaan mengharuskan pindah ke daerah lain?","Apakah Anda lebih mengutamakan memiliki rumah sendiri, menyewa, atau tinggal sementara bersama keluarga?"]},{"number":4,"text":"Bagaimana Anda ingin mengembangkan karier, pekerjaan, atau usaha setelah menikah?","prompts":["Apa target karier atau usaha yang ingin Anda capai?","Apakah Anda memiliki rencana melanjutkan pendidikan atau meningkatkan kompetensi?","Bagaimana jika salah satu pasangan memperoleh kesempatan pekerjaan di luar kota atau luar negeri?","Bagaimana cara mendukung cita-cita pasangan tanpa mengabaikan kebutuhan keluarga?","Bagaimana jika perkembangan karier salah satu pihak membutuhkan waktu, biaya, atau pengorbanan tertentu dari kehidupan keluarga?"]},{"number":5,"text":"Gaya hidup seperti apa yang ingin Anda bangun bersama keluarga setelah menikah?","prompts":["Apakah Anda lebih menyukai kehidupan sederhana, moderat, atau memiliki target gaya hidup tertentu?","Bagaimana pandangan Anda mengenai rekreasi, perjalanan, dan kegiatan bersama keluarga?","Seberapa penting kepemilikan kendaraan, rumah, atau barang-barang tertentu?","Bagaimana Anda membedakan kebutuhan keluarga dengan keinginan mengikuti gaya hidup orang lain?","Bagaimana Anda menyikapi perbedaan keinginan mengenai gaya hidup dan penggunaan penghasilan keluarga?"]},{"number":6,"text":"Bagaimana Anda ingin menjaga kehidupan agama dan hubungan spiritual keluarga dalam jangka panjang?","prompts":["Kebiasaan ibadah apa yang ingin dibangun secara konsisten?","Apakah Anda memiliki cita-cita untuk beribadah haji atau umrah bersama keluarga?","Bagaimana Anda ingin melibatkan keluarga dalam kegiatan sosial dan keagamaan?","Bagaimana menjaga agar kesibukan pekerjaan dan kebutuhan ekonomi tidak mengabaikan kehidupan spiritual?","Bagaimana Anda ingin menjaga semangat beribadah ketika menghadapi kesibukan pekerjaan, perubahan usia, atau kesulitan ekonomi?"]},{"number":7,"text":"Bagaimana Anda memandang kehidupan ketika memasuki usia lanjut?","prompts":["Bagaimana Anda ingin menjalani kehidupan setelah tidak lagi aktif bekerja?","Apakah An function openAutoBackupDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB tidak tersedia'));return;}const req=indexedDB.open('BEKAL_NIKAH_LOCAL_BACKUP',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('snapshots'))req.result.createObjectStore('snapshots',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}

async function writeAutoBackup(){try{const db=await openAutoBackupDB();const tx=db.transaction('snapshots','readwrite');const store=tx.objectStore('snapshots');const req=store.getAll();req.onsuccess=()=>{const all=req.result||[];const latest=all.find(x=>x.id==='latest');if(latest)store.put({id:'previous',savedAt:latest.savedAt,data:latest.data});store.put({id:'latest',savedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(state))});all.filter(x=>x.id!=='latest'&&x.id!=='previous').forEach(x=>store.delete(x.id));};await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});db.close();const badge=document.getElementById('saveState');if(badge){badge.textContent='● Tersimpan otomatis + cadangan lokal';badge.style.color='';}}catch(e){console.warn('Cadangan lokal otomatis tidak tersedia',e);}}
async function readAutoBackup(id='latest'){const db=await openAutoBackupDB();try{return await new Promise((resolve,reject)=>{const req=db.transaction('snapshots','readonly').objectStore('snapshots').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});}finally{db.close();}}
async function restoreAutoBackup(){try{const item=await readAutoBackup();if(!item){alert('Belum ada cadangan lokal otomatis pada perangkat ini.');return;}if(!confirm('Pulihkan cadangan lokal tanggal '+new Date(item.savedAt).toLocaleString('id-ID')+'? Data yang tampil sekarang akan diganti.'))return;await writeAutoBackup();state=item.data;save();render();alert('Cadangan lokal berhasil dipulihkan.');}catch(e){alert('Cadangan lokal tidak dapat dibaca. Gunakan file Backup JSON jika tersedia.');}}
function getLastExternalBackup(){try{return localStorage.getItem('bekalnikah_last_json_backup')||'';}catch(e){return '';}}
function backupReminderText(){const last=getLastExternalBackup();if(!last)return 'Anda belum pernah mengunduh Backup JSON pada perangkat ini. Sebaiknya unduh backup setelah menyelesaikan beberapa bagian.';const days=Math.floor((Date.now()-new Date(last).getTime())/86400000);return days>=7?'Sudah '+days+' hari sejak backup JSON terakhir. Unduh backup baru.':'Backup JSON terakhir diunduh '+days+' hari yang lalu. Unduh kembali setelah menyelesaikan bagian penting.';}
function save(){try{localStorage.setItem('bekalnikah_data',JSON.stringify(state));scheduleAutoBackup();const badge=document.getElementById('saveState');if(badge){badge.textContent='● Tersimpan otomatis';badge.style.color='';}return true;}catch(error){const badge=document.getElementById('saveState');if(badge){badge.textContent='! Gagal menyimpan. Unduh backup data.';badge.style.color='#a33';}console.error('BEKAL NIKAH: penyimpanan lokal gagal',error);return false;}}
function normalizeReflectionForRole(role){
 state.reflection??={};
 const keys=Object.keys(state.reflection);
 const isLegacy=keys.some(k=>/^\d+$/.test(k));
 if(isLegacy){
  const legacy=state.reflection;
  state.reflection={male:{},female:{}};
  state.reflection[role]=legacy;
 }else{
  state.reflection.male??={};
  state.reflection.female??={};
 }
}
function setParticipantProfile(){
 const role=document.getElementById('participantRole')?.value||'';
 const room=(document.getElementById('roomCode')?.value||'').trim().toUpperCase();
 const name=(document.getElementById('participantName')?.value||'').trim();
 if(!role){alert('Pilih identitas Anda terlebih dahulu.');return;}
 state.profile??={};
 normalizeReflectionForRole(role);
 state.profile.participantRole=role;
 state.profile.participantName=name;
 state.profile.roomCode=room;
 save();render();
 alert('Identitas peserta berhasil disimpan. Gunakan kode ruang yang sama pada perangkat calon pasangan.');
}
function generateRoomCode(){
 const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 let code='';for(let i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];
 const el=document.getElementById('roomCode');if(el)el.value=code;
}
function putReflection(number,field,value){

 if(!role){alert('Atur identitas peserta terlebih dahulu pada menu Backup Data.');return;}

}

${block('1. Apa itu dashboard BEKAL NIKAH?',`

function backup(v){
 const role=state.profile?.participantRole||'',room=state.profile?.roomCode||'',last=getLastExternalBackup(),lastText=last?new Date(last).toLocaleString('id-ID'):'Belum pernah';
 v.innerHTML=`<div class="sectionhead" style="margin-top:0"><div><h2>Pengaturan dan Pertukaran Data</h2><p>Ikuti tiga langkah berikut. Jawaban tersimpan otomatis. Anda tidak perlu menekan tombol simpan setelah mengisi.</p></div></div>
 <div class="panel"><span class="pill">LANGKAH 1</span><h3 style="color:var(--green)">Atur identitas Anda</h3><p>Pilih siapa yang menggunakan perangkat ini. Kedua calon pasangan harus menggunakan kode ruang yang sama.</p><div class="two"><div class="field"><label>SAYA ADALAH</label><select id="participantRole"><option value="">Pilih identitas</option><option value="male" ${role==='male'?'selected':''}>Calon pasangan pria</option><option value="female" ${role==='female'?'selected':''}>Calon pasangan wanita</option></select></div><div class="field"><label>NAMA SAYA (OPSIONAL)</label><input id="participantName" value="${esc(state.profile?.participantName||'')}" placeholder="Nama Anda"></div></div><div class="field"><label>KODE RUANG DISKUSI</label><div class="actions"><input id="roomCode" maxlength="12" style="max-width:220px;text-transform:uppercase" value="${esc(room)}" placeholder="Contoh: A7K9P2"><button class="btn secondary" type="button" onclick="generateRoomCode()">Buat kode</button></div><small style="color:var(--muted)">Jika pasangan sudah memiliki kode, masukkan kode yang sama. Jika belum, salah satu peserta dapat membuat kode dan membagikannya.</small></div><button class="btn" onclick="setParticipantProfile()">Simpan Identitas</button><p class="notice" style="margin-top:12px">Status: <b>${role==='male'?'Calon pasangan pria':role==='female'?'Calon pasangan wanita':'Identitas belum diatur'}</b> · Kode ruang: <b>${esc(room||'Belum dibuat')}</b></p></div>
 <div class="panel" style="margin-top:14px"><span class="pill">LANGKAH 2</span><h3 style="color:var(--green)">Kirim atau terima jawaban pasangan</h3><p><b>Untuk mengirim:</b> tekan Ekspor Jawaban untuk Pasangan, lalu kirim file yang terunduh kepada pasangan.</p><button class="btn" onclick="exportExchangeFile()">Ekspor Jawaban untuk Pasangan</button><div class="divider" style="margin:18px 0"></div><p><b>Untuk menerima:</b> pilih file dari pasangan, lalu tekan Gabungkan Jawaban Pasangan.</p><div class="field"><label>PILIH FILE DARI PASANGAN</label><input type="file" id="exchangeFile" accept=".json,application/json"></div><button class="btn secondary" onclick="mergeExchangeFile()">Gabungkan Jawaban Pasangan</button><div class="notice" style="margin-top:12px">Setelah berhasil menggabungkan, ekspor kembali file terbaru dan kirimkan kepada pasangan. Pertukaran file tidak berlangsung otomatis.</div></div>
 <div class="panel" style="margin-top:14px"><span class="pill">LANGKAH 3</span><h3 style="color:var(--green)">Simpan salinan cadangan pribadi</h3><p>Backup JSON berguna jika Anda berganti perangkat atau kehilangan data browser. Simpan file ini di tempat aman.</p><p style="font-size:13px;color:var(--muted)">Terakhir mengunduh backup: <b>${lastText}</b></p><button class="btn" onclick="exportData()">Unduh Backup JSON</button><details style="margin-top:14px"><summary style="cursor:pointer;color:var(--green);font-weight:700">Saya ingin memulihkan backup JSON</summary><p style="font-size:13px;color:var(--muted)">Pilih file backup pribadi. Pemulihan akan mengganti data yang sedang terbuka pada perangkat ini.</p><div class="field"><label>PILIH FILE BACKUP JSON</label><input type="file" id="restoreFile" accept=".json,application/json"></div><button class="btn secondary" style="margin-top:10px" onclick="importData()">Pulihkan Backup JSON</button></details></div><div class="panel" style="margin-top:14px;border:1px solid #d9b7a9"><h3 style="color:#9b3d2e">Reset data pada perangkat ini</h3><p>Gunakan hanya jika ingin mengosongkan jawaban dan identitas yang tersimpan di browser ini. Sebelum reset, unduh Backup JSON jika masih ingin menyimpan data. Sistem membuat satu cadangan lokal otomatis sebelum menghapus data utama.</p><button class="btn secondary" style="border-color:#b65a4a;color:#9b3d2e" onclick="clearData()">Reset seluruh data perangkat ini</button></div><p class="notice" style="margin-top:14px"><b>Ingat:</b> jawaban tersimpan otomatis di perangkat. File pertukaran digunakan untuk menggabungkan jawaban pasangan. Backup JSON adalah salinan pribadi.</p>`;
}
function cloneData(value){return JSON.parse(JSON.stringify(value??{}));}
function isBlankValue(v){return v===undefined||v===null||v==='';}
function mergeSharedObject(localValue,incomingValue,counter){
 if(incomingValue===undefined||incomingValue===null)return localValue;
 if(localValue===undefined||localValue===null||localValue==='')return cloneData(incomingValue);
 if(typeof localValue==='object'&&typeof incomingValue==='object'&&!Array.isArray(localValue)&&!Array.isArray(incomingValue)){
  const out={...localValue};
  for(const key of Object.keys(incomingValue)){
   if(!(key in out)||isBlankValue(out[key]))out[key]=cloneData(incomingValue[key]);
   else out[key]=mergeSharedObject(out[key],incomingValue[key],counter);
  }
  return out;
 }
 if(Array.isArray(localValue)&&Array.isArray(incomingValue)){
  if(!localValue.length)return cloneData(incomingValue);
  if(JSON.stringify(localValue)!==JSON.stringify(incomingValue))counter.conflicts++;
  return localValue;
 }
 if(localValue!==incomingValue)counter.conflicts++;
 return localValue;
}
function exportExchangeFile(){
 const role=state.profile?.participantRole,room=(state.profile?.roomCode||'').trim().toUpperCase();
 if(!role||!room){alert('Atur identitas peserta dan kode ruang diskusi terlebih dahulu pada bagian ini.');return;}
 const payload={product:'BEKAL NIKAH',type:'BEKAL_NIKAH_EXCHANGE',version:'2.10',roomCode:room,participantRole:role,participantName:state.profile?.participantName||'',exportedAt:new Date().toISOString(),data:cloneData(state)};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const a=document.createElement('a'),url=URL.createObjectURL(blob);
 a.href=url;a.download='Pertukaran_BEKAL_NIKAH_'+room+'_'+role+'_'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 alert('File pertukaran berhasil disiapkan. Kirim file tersebut kepada calon pasangan melalui saluran pribadi.');
}
function mergeExchangeFile(){
 const file=document.getElementById('exchangeFile')?.files?.[0];
 if(!file){alert('Pilih file pertukaran dari calon pasangan terlebih dahulu.');return;}
 const reader=new FileReader();
 reader.onload=async()=>{
  try{
   const packet=JSON.parse(reader.result);
   if(packet.product!=='BEKAL NIKAH'||packet.type!=='BEKAL_NIKAH_EXCHANGE'||!packet.data)throw new Error('format');
   const myRole=state.profile?.participantRole,myRoom=(state.profile?.roomCode||'').trim().toUpperCase();
   if(!myRole||!myRoom){alert('Atur identitas dan kode ruang diskusi perangkat ini terlebih dahulu.');return;}
   if(packet.roomCode!==myRoom){alert('Kode ruang diskusi tidak cocok. Pastikan kedua perangkat menggunakan kode ruang yang sama.');return;}
   if(packet.participantRole===myRole){alert('File ini berasal dari identitas peserta yang sama. Untuk penggabungan pasangan, pilih file dari calon pasangan dengan identitas berbeda.');return;}
   if(!['male','female'].includes(packet.participantRole)){alert('Identitas pada file pertukaran tidak valid.');return;}
   const date=packet.exportedAt?new Date(packet.exportedAt).toLocaleString('id-ID'):'tanggal tidak tercatat';
   if(!confirm('Gabungkan jawaban dari '+(packet.participantName|| (packet.participantRole==='male'?'calon pasangan pria':'calon pasangan wanita'))+'? File dibuat pada '+date+'. Data perangkat ini akan dipertahankan. Jika ada isian bersama yang berbeda, sistem mempertahankan isian perangkat ini dan menghitungnya sebagai konflik untuk diperiksa. Lanjutkan?'))return;
   await writeAutoBackup();
   const incoming=packet.data,role=packet.participantRole,counter={conflicts:0,added:0};
   // Import only the participant's own answers, never overwrite the local participant's answers.
   state.answers??={};
   for(const [key,val] of Object.entries(incoming.answers||{})){
    if(!val||typeof val!=='object')continue;
    state.answers[key]??={};
    const incomingAnswer=val[role];
    if(!isBlankValue(incomingAnswer)){
     if(isBlankValue(state.answers[key][role])){state.answers[key][role]=incomingAnswer;counter.added++;}
     else if(state.answers[key][role]!==incomingAnswer)counter.conflicts++;
    }
   }
   // Merge participant reflections, including legacy flat-key backups.
   state.reflection??={};
   const sourceReflection=incoming.reflection||{};
   let incomingReflection=null;
   if(sourceReflection[role] && typeof sourceReflection[role]==='object') incomingReflection=sourceReflection[role];
   else if(Object.keys(sourceReflection).some(k=>/^\d+$/.test(String(k)))) incomingReflection=sourceReflection;
   else if(sourceReflection.data?.[role]) incomingReflection=sourceReflection.data[role];
   if(incomingReflection && typeof incomingReflection==='object'){
    state.reflection.male??={};state.reflection.female??={};
    const target=state.reflection[role];
    for(const [number,fields] of Object.entries(incomingReflection)){
     if(!/^\d+$/.test(String(number))||!fields||typeof fields!=='object')continue;
     target[number]??={};
     for(const [field,value] of Object.entries(fields)){
      if(isBlankValue(value))continue;
      if(isBlankValue(target[number][field])){target[number][field]=cloneData(value);counter.added++;}
      else if(target[number][field]!==value)counter.conflicts++;
     }
    }
   }
   // Discussion reflections may contain participant-specific fields.
   state.discussionReflection??={};
   for(const [cat,items] of Object.entries(incoming.discussionReflection||{})){
    state.discussionReflection[cat]??={};
    for(const [key,vals] of Object.entries(items||{})){
     if(vals&&typeof vals==='object'&&role in vals){
      state.discussionReflection[cat][key]??={};
      if(isBlankValue(state.discussionReflection[cat][key][role]))state.discussionReflection[cat][key][role]=vals[role];
      else if(state.discussionReflection[cat][key][role]!==vals[role])counter.conflicts++;
     }
    }
   }
   // Shared work instruments and agreements: fill empty fields; preserve local values on conflict.
   state.agreements=mergeSharedObject(state.agreements||{},incoming.agreements||{},counter);
   state.instrumentData=mergeSharedObject(state.instrumentData||{},incoming.instrumentData||{},counter);
   state.instruments=mergeSharedObject(state.instruments||{},incoming.instruments||{},counter);
   // Bring across partner name only, plus shared date/place when currently empty.
   state.profile??={};
   const nameKey=role;
   const incomingName=incoming.profile?.[nameKey]||incoming.profile?.participantName||packet.participantName;
   if(incomingName&&!state.profile[nameKey])state.profile[nameKey]=incomingName;
   for(const key of ['date','place'])if(isBlankValue(state.profile[key])&&!isBlankValue(incoming.profile?.[key]))state.profile[key]=incoming.profile[key];
   state.profile.roomCode=myRoom;
   state.profile.participantRole=myRole;
   if(!save())throw new Error('save');
   render();
   alert('Penggabungan selesai. '+counter.added+' isian pasangan ditambahkan. '+counter.conflicts+' perbedaan ditemukan pada isian yang sama. Isian lokal dipertahankan jika terjadi perbedaan. Periksa kembali instrumen dan Peta Kesepakatan, lalu ekspor file pertukaran terbaru untuk dikirimkan kembali.');
  }catch(err){console.error(err);alert('File pertukaran tidak valid atau tidak dapat diproses. Data perangkat ini tidak diganti.');}
 };
 reader.onerror=()=>alert('File tidak dapat dibaca.');
 reader.readAsText(file);
}
function exportData(){const payload={product:'BEKAL NIKAH',version:'2.10',exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='Backup_BEKAL_NIKAH_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);try{localStorage.setItem('bekalnikah_last_json_backup',new Date().toISOString());}catch(e){}const el=document.getElementById('backupReminder');if(el)el.textContent='Backup JSON baru saja disiapkan. Pastikan file muncul di folder Unduhan perangkat Anda.';}
function importData(){const f=document.getElementById('restoreFile').files[0];if(!f)return alert('Pilih file backup terlebih dahulu.');const r=new FileReader();r.onload=async()=>{try{const x=JSON.parse(r.result);if(!x.data||x.product!=='BEKAL NIKAH')throw Error('invalid');const date=x.exportedAt?new Date(x.exportedAt).toLocaleString('id-ID'):'tanggal tidak tercatat';if(!confirm('Pulihkan backup tanggal '+date+'? Data yang sedang tampil akan diganti. Sistem akan mencoba membuat cadangan lokal terlebih dahulu. Lanjutkan?'))return;await writeAutoBackup();state=x.data;if(!save())throw Error('save');render();alert('Data berhasil dipulihkan. Periksa kembali jawaban dan identitas peserta.');}catch(e){alert('File backup tidak valid atau data tidak dapat disimpan.');}};r.onerror=()=>alert('File tidak dapat dibaca.');r.readAsText(f);}
function clearData(){if(confirm('Reset seluruh jawaban, refleksi, kesepakatan, instrumen, dan identitas utama BEKAL NIKAH pada browser ini? Unduh Backup JSON terlebih dahulu jika data masih diperlukan. Sistem akan menyimpan snapshot otomatis terakhir sebagai cadangan pemulihan lokal. Lanjutkan?')){writeAutoBackup().finally(()=>{localStorage.removeItem('bekalnikah_data');state=load();render();});}}
render();
if(state && Object.keys(state).length) scheduleAutoBackup();
</script></body></html>
